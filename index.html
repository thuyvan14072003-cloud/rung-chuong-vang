<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rung Chuông Vàng – 180 câu</title>
<style>body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px #0002}h1{text-align:center;font-size:22px}.sub,.hint{text-align:center;color:#667085;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.badge{background:#eaf0ff;color:#175cd3;padding:7px 10px;border-radius:999px;font-weight:800}.timer{font-size:34px;font-weight:900}.warn{color:#d92d20}.audio{padding:14px;border:1px solid #d0d5dd;border-radius:14px;background:#f8fafc}audio{width:100%}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#175cd3;color:#fff}#game,#result{display:none}.answerbox{margin-top:20px}label{display:block;font-weight:800;font-size:17px;margin-bottom:8px}input{width:100%;padding:14px;border:2px solid #d0d5dd;border-radius:12px;font-size:22px;text-align:center;outline:none;box-sizing:border-box}.status{display:none;margin-top:16px;padding:14px;border-radius:12px;font-weight:800}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fef3f2;color:#b42318}.time{background:#fffaeb;color:#b54708}.score{font-size:52px;font-weight:900;text-align:center}#next{display:none;margin-top:14px}</style>
</head><body><div class="app"><div class="card"><h1>🔔 RUNG CHUÔNG VÀNG</h1><div class="sub">180 câu • Xáo trộn • Audio xong mới tính 15 giây</div>
<div id="setup"><p><b>Bản tối ưu cho iPhone.</b></p><p class="hint">Không hiện câu hỏi hoặc phương án. Nghe audio rồi tự nhập đáp án.</p><button id="start" class="primary">BẮT ĐẦU</button></div>
<div id="game"><div class="top"><div id="no" class="badge"></div><div id="timer" class="timer">15</div></div><div class="audio"><audio id="audio" controls preload="metadata"></audio><button id="play" class="primary">▶ PHÁT AUDIO</button><div id="msg" class="hint">Bấm PHÁT AUDIO. Khi audio kết thúc, 15 giây mới bắt đầu.</div></div><div class="answerbox"><label>Nhập đáp án</label><input id="answer" autocomplete="off" placeholder="Nhập đáp án của bạn"><button id="check" class="primary" style="margin-top:10px">KIỂM TRA ĐÁP ÁN</button><div class="hint">Trắc nghiệm: A/B/C/D. Câu điền: nhập tự do.</div></div><div id="status" class="status"></div><button id="next" class="primary">CÂU TIẾP THEO →</button></div>
<div id="result"><h2>🎉 HOÀN THÀNH</h2><div id="score" class="score"></div><p id="resultText"></p><button class="primary" onclick="location.reload()">CHƠI LẠI</button></div>
<script>
const Q=[{"number":1,"type":"mc","answer":"C"},{"number":2,"type":"mc","answer":"B"},{"number":3,"type":"mc","answer":"B"}];
/* Các câu 4–180 sẽ được đọc từ questions.js khi bộ dữ liệu được tải lên. */
let quiz=[],i=0,score=0,locked=false,left=15,timer=null;const audio=document.getElementById('audio'),input=document.getElementById('answer'),statusBox=document.getElementById('status');
function shuffle(a){a=[...a];for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim()}
document.getElementById('start').onclick=()=>{quiz=shuffle(window.GAME_QUESTIONS||Q);i=0;score=0;document.getElementById('setup').style.display='none';document.getElementById('game').style.display='block';show()};
function show(){clearInterval(timer);locked=false;left=15;statusBox.style.display='none';document.getElementById('next').style.display='none';document.getElementById('check').style.display='block';input.disabled=false;input.value='';let q=quiz[i];document.getElementById('no').textContent=`Câu ${i+1} / ${quiz.length}`;document.getElementById('timer').textContent='15';document.getElementById('timer').classList.remove('warn');input.placeholder=q.type==='mc'?'Nhập A / B / C / D':'Nhập đáp án đầy đủ...';audio.src=q.audio;audio.load();document.getElementById('play').style.display='block';document.getElementById('msg').textContent='Bấm PHÁT AUDIO. Khi audio kết thúc, 15 giây mới bắt đầu.'}
document.getElementById('play').onclick=()=>audio.play().then(()=>{document.getElementById('play').style.display='none';document.getElementById('msg').textContent='🔊 Đang phát audio — chưa tính 15 giây.'}).catch(()=>alert('Không phát được audio.'));
audio.onended=()=>{left=15;tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);timeoutQ()}},1000)};function tick(){document.getElementById('timer').textContent=left;document.getElementById('timer').classList.toggle('warn',left<=5)}
document.getElementById('check').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check()};function lock(){locked=true;clearInterval(timer);input.disabled=true;document.getElementById('check').style.display='none'}function check(){if(locked)return;let q=quiz[i],raw=input.value.trim();if(!raw)return input.focus();lock();let ok=q.type==='mc'?raw.toUpperCase()===q.answer:norm(raw)===norm(q.answer);if(ok){score++;statusBox.className='status ok';statusBox.textContent='✅ ĐÚNG! Đáp án: '+q.answer}else{statusBox.className='status bad';statusBox.textContent='❌ SAI! Đáp án đúng: '+q.answer}statusBox.style.display='block';showNext()}function timeoutQ(){if(locked)return;lock();let q=quiz[i];statusBox.className='status time';statusBox.textContent='⏰ HẾT GIỜ! Đáp án đúng: '+q.answer;statusBox.style.display='block';showNext()}function showNext(){let b=document.getElementById('next');b.style.display='block';b.textContent=i===quiz.length-1?'XEM KẾT QUẢ →':'CÂU TIẾP THEO →'}document.getElementById('next').onclick=()=>{i++;if(i>=quiz.length)finish();else show()};function finish(){audio.pause();document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=`${score} / ${quiz.length}`;document.getElementById('resultText').textContent=`Bạn trả lời đúng ${score} trên ${quiz.length} câu.`}
</script></div></div></body></html>
